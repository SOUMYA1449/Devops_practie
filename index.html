
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Practice</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1e293b;
            color: white;
            text-align: center;
            padding-top: 100px;
        }

        .container {
            background: #334155;
            padding: 40px;
            margin: auto;
            width: 80%;
            max-width: 500px;
            border-radius: 15px;
        }

        h1 {
            color: #38bdf8;
        }

        button {
            background: #38bdf8;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Hello Devops </h1>

        <p>My first automated deployment using:</p>

        <h3>Git | Jenkins | Docker | AWS EC2</h3>

        <p id="message">Welcome to my DevOps website!</p>

        <button onclick="changeMessage()">
            Test Deployment
        </button>
    </div>

    <script>
        function changeMessage() {
            document.getElementById("message").innerText =
                "Deployment is working successfully!";
        }
    </script>

</body>
</html>
